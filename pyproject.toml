[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-redaction-pipeline"
version = "0.1.0"
description = "Validation, hybrid PII detection, irreversible PDF redaction/masking, and verification"
requires-python = ">=3.11"
dependencies = [
  "PyMuPDF>=1.24",
  "pypdf>=5",
  "pydantic>=2",
  "Pillow>=10",
  "pytesseract>=0.3.13",
]

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
azure = [
  "azure-ai-documentintelligence>=1.0.0",
  "azure-ai-textanalytics>=5.3.0",
  "azure-identity>=1.19.0",
]
dev = ["pytest>=8"]

[project.scripts]
redact-pdf = "redaction_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
